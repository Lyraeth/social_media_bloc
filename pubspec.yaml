name: social_media_bloc
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
    sdk: ^3.8.1

dependencies:
    bloc: ^9.0.0
    equatable: ^2.0.7
    flutter:
        sdk: flutter
    flutter_bloc: ^9.1.1
    flutter_secure_storage: ^9.2.4
    http: ^1.4.0
    meta: ^1.16.0

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^5.0.0

flutter:
    uses-material-design: true
    assets:
        - assets/
        - assets/bl_logo.png
    fonts:
        - family: Quicksand
          fonts:
              - asset: assets/fonts/Quicksand-Regular.ttf
        - family: QuicksandBold
          fonts:
              - asset: assets/fonts/Quicksand-Regular.ttf
              - asset: assets/fonts/Quicksand-Bold.ttf
                weight: 700
